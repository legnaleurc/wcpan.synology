components:
  schemas:
    SuccessEnvelope:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          additionalProperties: true

    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          const: false
        error:
          type: object
          required: [code]
          properties:
            code:
              type: integer
            errors:
              oneOf:
                - type: object
                  additionalProperties: true
                - type: array
                  items:
                    type: object
                    additionalProperties: true

    FilesGenericRpcForm:
      type: object
      required: [api, version, method, _sid]
      properties:
        api:
          type: string
          const: SYNO.SynologyDrive.Files
        version:
          oneOf:
            - type: string
              const: "11"
            - type: integer
              const: 11
        method:
          type: string
        _sid:
          type: string

    FilesGetForm:
      allOf:
        - $ref: "#/components/schemas/FilesGenericRpcForm"
        - type: object
          required: [path]
          properties:
            method:
              type: string
              const: get
            path:
              type: string
              description: |
                Path reference form.

                Accepted forms:
                - `link:<permanent_link>`
                - `id:<file-id>`
                - `id:<file-id>/<basename>` when a child is addressed beneath a parent id
                - `/mydrive/<relative-path>`
                - `/team-folders/<team-folder-name>/<relative-path>`
                - `/views/<view_id>/<relative-path>`
                - `/volumes/<absolute-path>`

    FilesListFilter:
      type: object
      properties:
        extensions:
          type: array
          items:
            type: string
        type:
          type: array
          items:
            type: string
        label_id:
          type: string
        starred:
          type: boolean

    FilesListForm:
      allOf:
        - $ref: "#/components/schemas/FilesGenericRpcForm"
        - type: object
          required: [path]
          properties:
            method:
              type: string
              const: list
            path:
              type: string
            sort_by:
              type: string
              default: name
            sort_direction:
              type: string
              enum: [asc, desc]
              default: asc
            offset:
              type: integer
              minimum: 0
              default: 0
            limit:
              type: integer
              minimum: 0
              default: 0
            filter:
              oneOf:
                - $ref: "#/components/schemas/FilesListFilter"
                - type: string
                  description: JSON-stringified filter object
            extra:
              oneOf:
                - type: array
                  items:
                    type: string
                    enum: [sync_to_device]
                - type: string
                  description: JSON-stringified extra array

    FilesCreateForm:
      allOf:
        - $ref: "#/components/schemas/FilesGenericRpcForm"
        - type: object
          required: [type, path]
          properties:
            method:
              type: string
              const: create
            type:
              type: string
              enum: [file, folder]
            path:
              type: string
            conflict_action:
              type: string
              enum: [overwrite, autorename, stop]
              default: stop
            mute:
              type: boolean
            permanent_link:
              type: string
            encrypted:
              type: boolean
            removed:
              type: boolean
            file_content:
              type: string
              description: Base64 encoded file content. Intended for small files only.
            labels:
              oneOf:
                - type: array
                  items:
                    type: string
                - type: string
                  description: JSON-stringified labels array
            modified_time:
              type: integer
            access_time:
              type: integer
            created_time:
              type: integer

    FilesUpdateForm:
      allOf:
        - $ref: "#/components/schemas/FilesGenericRpcForm"
        - type: object
          required: [path]
          properties:
            method:
              type: string
              const: update
            path:
              type: string
            mute:
              type: boolean
            encrypted:
              type: boolean
            removed:
              type: boolean
            starred:
              oneOf:
                - type: boolean
                - type: string
                  description: JSON-stringified star action payload
                - type: array
                  items:
                    type: object
                    additionalProperties: true
            labels:
              oneOf:
                - type: array
                  items:
                    oneOf:
                      - type: string
                      - type: object
                        additionalProperties: true
                - type: string
                  description: JSON-stringified labels payload
            modified_time:
              type: integer
            created_time:
              type: integer
            access_time:
              type: integer
            name:
              type: string

    FilesMoveForm:
      allOf:
        - $ref: "#/components/schemas/FilesGenericRpcForm"
        - type: object
          required: [to_parent_folder, files]
          properties:
            method:
              type: string
              const: move
            dry_run:
              type: boolean
            conflict_action:
              type: string
              enum: [overwrite, autorename, skip, stop, version]
              default: autorename
            to_parent_folder:
              type: string
            files:
              oneOf:
                - type: string
                  description: JSON-stringified array such as `["id:<file-id>"]`
                - type: array
                  items:
                    type: string

    FilesDeleteForm:
      allOf:
        - $ref: "#/components/schemas/FilesGenericRpcForm"
        - type: object
          required: [files]
          properties:
            method:
              type: string
              const: delete
            permanent:
              type: boolean
              default: false
            files:
              oneOf:
                - type: string
                  description: JSON-stringified array such as `["id:<file-id>"]`
                - type: array
                  items:
                    type: string

    FilesDownloadForm:
      allOf:
        - $ref: "#/components/schemas/FilesGenericRpcForm"
        - type: object
          required: [files]
          properties:
            method:
              type: string
              const: download
            dry_run:
              type: boolean
            decrypt:
              oneOf:
                - type: object
                  additionalProperties: true
                - type: string
                  description: JSON-stringified decrypt payload
            force_download:
              type: boolean
            archive_name:
              type: string
              default: download
            files:
              oneOf:
                - type: string
                  description: JSON-stringified array such as `["id:<file-id>"]`
                - type: array
                  items:
                    type: string

    FilesUploadMultipart:
      type: object
      required: [file, path]
      properties:
        file:
          type: string
          format: binary
        conflict_action:
          type: string
          enum: [overwrite, autorename, stop, version]
        type:
          type: string
          enum: [file, folder]
        mute:
          type: boolean
        encrypted:
          type: boolean
        starred:
          oneOf:
            - type: boolean
            - type: string
        labels:
          oneOf:
            - type: string
            - type: array
              items:
                oneOf:
                  - type: string
                  - type: object
                    additionalProperties: true
        modified_time:
          type: integer
        created_time:
          type: integer
        access_time:
          type: integer
        path:
          type: string
          description: Observed working form is `id:<parent-id>/<basename>`.

    AsyncTaskQueuedResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [async_task_id]
          properties:
            async_task_id:
              type: string

    MemberInfo:
      type: object
      properties:
        uid:
          type: integer
        name:
          type: string
        nickname:
          type: string
        display_name:
          type: string

    PermissionInfo:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        nickname:
          type: string
        display_name:
          type: string
        role:
          type: string
        inherited:
          type: boolean
        permission_id:
          type: string

    LabelInfo:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        label_id:
          type: string
        color:
          type: string

    ImageMetadata:
      type: object
      additionalProperties: true

    NodeLocking:
      type: object
      properties:
        is_locked:
          type: boolean

    Capabilities:
      type: object
      properties:
        can_comment:
          type: boolean
        can_delete:
          type: boolean
        can_download:
          type: boolean
        can_encrypt:
          type: boolean
        can_organize:
          type: boolean
        can_preview:
          type: boolean
        can_read:
          type: boolean
        can_rename:
          type: boolean
        can_share:
          type: boolean
        can_sync:
          type: boolean
        can_write:
          type: boolean

    FileInfo:
      type: object
      required:
        - watermark_version
        - transient
        - dsm_path
        - adv_shared
        - enable_watermark
        - force_watermark_download
        - support_remote
        - disable_download
        - app_properties
        - revisions
        - content_snippet
        - hash
        - permanent_link
        - owner
        - shared_with
        - sync_to_device
        - shared
        - starred
        - encrypted
        - removed
        - max_id
        - change_id
        - sync_id
        - version_id
        - capabilities
        - size
        - change_time
        - modified_time
        - access_time
        - created_time
        - parent_id
        - content_type
        - type
        - name
        - display_path
        - path
        - file_id
      properties:
        uploaded_size:
          type: integer
          format: int64
          minimum: 0
        watermark_version:
          type: integer
          format: int64
          minimum: 0
        transient:
          type: boolean
        dsm_path:
          type: string
        adv_shared:
          type: boolean
        enable_watermark:
          type: boolean
        force_watermark_download:
          type: boolean
        support_remote:
          type: boolean
        in_disconnected_cold_tier:
          type: boolean
        disable_download:
          type: boolean
        last_modified_by:
          $ref: "#/components/schemas/MemberInfo"
        app_properties:
          type: object
          additionalProperties: true
        properties:
          type: object
          additionalProperties: true
        image_metadata:
          $ref: "#/components/schemas/ImageMetadata"
        node_locking:
          $ref: "#/components/schemas/NodeLocking"
        revisions:
          type: integer
          minimum: 0
        content_snippet:
          type: string
        hash:
          type: string
        labels:
          type: array
          items:
            $ref: "#/components/schemas/LabelInfo"
        permanent_link:
          type: string
        owner:
          $ref: "#/components/schemas/MemberInfo"
        shared_with:
          type: array
          items:
            $ref: "#/components/schemas/PermissionInfo"
        sync_to_device:
          type: boolean
        shared:
          type: boolean
        starred:
          type: boolean
        encrypted:
          type: boolean
        removed:
          type: boolean
        max_id:
          type: integer
          format: int64
          minimum: 0
        change_id:
          type: integer
          format: int64
          minimum: 0
        sync_id:
          type: integer
          format: int64
          minimum: 0
        version_id:
          oneOf:
            - type: integer
              format: int64
              minimum: 0
            - type: string
        capabilities:
          $ref: "#/components/schemas/Capabilities"
        size:
          type: integer
          format: int64
          minimum: 0
        change_time:
          type: integer
          format: int64
          minimum: 0
          description: Observed as a Drive sync/change timestamp.
        modified_time:
          type: integer
          format: int64
          minimum: 0
          description: Observed as the content modification timestamp.
        access_time:
          type: integer
          format: int64
          minimum: 0
          description: Observed as a Drive record timestamp, not a reliable filesystem atime.
        created_time:
          type: integer
          format: int64
          minimum: 0
          description: Observed as a Drive record timestamp, not a reliable filesystem birth time.
        parent_id:
          type: string
        content_type:
          type: string
          enum: [dir, document, image, audio, video, file]
          description: Preview/media classification; a normal file may report `image` while `type` remains `file`.
        type:
          type: string
          enum: [file, dir]
        name:
          type: string
        display_path:
          type: string
          description: Full accessible Drive path such as `/team-folders/<share>/<path>`.
        path:
          type: string
          description: Path relative to the requested parent or current navigation root.
        file_id:
          type: string

    FileInfoResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: "#/components/schemas/FileInfo"

    FileListResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [total, items]
          properties:
            total:
              type: integer
            items:
              type: array
              items:
                $ref: "#/components/schemas/FileInfo"

    DriveTaskFileRef:
      type: object
      properties:
        path:
          type: string

    DriveTaskTarget:
      type: object
      properties:
        file_id:
          type: string
        parent_id:
          type: string
        file_type:
          type: string
          enum: [file, dir]
        name:
          type: string
        path:
          type: string

    DriveTaskError:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        context:
          type: object
          additionalProperties: true

    DriveTaskResult:
      type: object
      properties:
        action:
          type: string
        errors:
          oneOf:
            - type: "null"
            - type: array
              items:
                $ref: "#/components/schemas/DriveTaskError"
        processed_size:
          type: integer
        total_size:
          type: integer
        names:
          type: array
          items:
            type: string
        params:
          type: object
          properties:
            files:
              type: array
              items:
                $ref: "#/components/schemas/DriveTaskFileRef"
        targets:
          type: array
          items:
            $ref: "#/components/schemas/DriveTaskTarget"

    DriveTask:
      type: object
      required: [task_id, status, progress]
      properties:
        task_id:
          type: string
        status:
          type: string
        progress:
          type: integer
        result:
          $ref: "#/components/schemas/DriveTaskResult"

    DriveTaskListResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [items, total]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/DriveTask"
            total:
              type: integer

    DriveTaskGetResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: "#/components/schemas/DriveTask"

    WebhookOptions:
      type: object
      properties:
        filter_file_ext:
          type: array
