openapi: 3.1.0
info:
  title: Synology WebStation SynologyDrive API
  version: 1.0.0
  summary: Self-contained reference for Synology Drive APIs exposed through DSM WebStation entry.cgi
  description: |
    This spec describes the WebStation-facing Synology Drive API family.

    The detailed operation objects below focus on:
    - SYNO.SynologyDrive.Files
    - SYNO.SynologyDrive.Tasks
    - SYNO.SynologyDrive.Webhooks

    The wider namespace family commonly also includes:
    - `SYNO.SynologyDrive.AdvanceSharing`
    - `SYNO.SynologyDrive.AdvanceSharing.Public`
    - `SYNO.SynologyDrive.Config`
    - `SYNO.SynologyDrive.DSM`
    - `SYNO.SynologyDrive.FileRequest`
    - `SYNO.SynologyDrive.Info`
    - `SYNO.SynologyDrive.Labels`
    - `SYNO.SynologyDrive.Notifications`
    - `SYNO.SynologyDrive.Office`
    - `SYNO.SynologyDrive.Photos`
    - `SYNO.SynologyDrive.Revisions`
    - `SYNO.SynologyDrive.Services.DocumentViewer`
    - `SYNO.SynologyDrive.Services.SynologyChat`
    - `SYNO.SynologyDrive.Services.VideoStation`
    - `SYNO.SynologyDrive.Settings`
    - `SYNO.SynologyDrive.Share`
    - `SYNO.SynologyDrive.Share.Priv`
    - `SYNO.SynologyDrive.Sharing`
    - `SYNO.SynologyDrive.String`
    - `SYNO.SynologyDrive.TeamFolders`
    - `SYNO.SynologyDrive.Trash`
    - `SYNO.SynologyDrive.Users`

    Authentication is assumed to be an existing DSM WebAPI session id passed as `_sid`.

    Path reference forms used by this API:
    - `link:<permanent_link>`
    - `id:<file-id>`
    - `id:<file-id>/<basename>`
    - `/mydrive/<relative-path>`
    - `/team-folders/<team-folder-name>/<relative-path>`
    - `/views/<view_id>/<relative-path>`
    - `/volumes/<absolute-path>`

    Notes:
    - `link:<permanent_link>` is the explicit permanent-link reference form.
    - `id:<file-id>` addresses an existing node directly.
    - `id:<file-id>/<basename>` is used when addressing a child beneath a parent id.
    - `/volumes/<absolute-path>` is an absolute-path form rather than a Drive-relative path.

    Verification legend:
    - Files transport and method availability: live-verified
    - Tasks schemas and conflict payloads: live-verified
    - Webhooks namespace and method availability: live-verified
    - Webhooks create/get/delete transport: live-verified with JSON-encoded query parameters
    - Webhooks field schemas: taken from the exported Synology Drive schema

    Common method names across the wider namespace family include:
    - `get`, `list`, `search`, `create`, `update`, `delete`
    - `copy`, `move`, `restore`, `download`, `upload`, `upload_from_dsm`
    - `list_ancestor`, `list_labelled`, `list_shared_with_me`, `list_starred`
    - `shared_with_me`, `shared_with_others`
    - `create_link`, `request_access`, `sync_to_device`
    - `get_metadata`, `get_thumbnail`, `quota`, `status`

    For related namespaces that are not expanded into full operation objects below, use the same
    `/webapi/entry.cgi` RPC pattern as a starting point and verify namespace availability,
    accepted version, and request format on the target DSM/Drive deployment.

servers:
  - url: https://dsm.example.test
    description: Placeholder DSM WebStation base URL

tags:
  - name: Files
  - name: Tasks
  - name: Webhooks
  - name: Labels
  - name: Share
  - name: Sharing
  - name: FileRequest
  - name: TeamFolders
  - name: Trash
  - name: Revisions
  - name: Notifications
  - name: Users
  - name: Info
  - name: Config
  - name: Settings
  - name: DSM
  - name: Office
  - name: Photos
  - name: SCIM
  - name: Services

paths:
  /webapi/entry.cgi#files-get:
    post:
      tags: [Files]
      summary: Get one file or folder
      description: |
        Documentation-only pseudo-endpoint for:

        - `api=SYNO.SynologyDrive.Files`
        - `version=11`
        - `method=get`

        Working transport is query-string RPC with JSON-encoded parameter values.
      operationId: driveFilesGet
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/FilesGetForm"
            examples:
              byId:
                value:
                  api: SYNO.SynologyDrive.Files
                  version: "11"
                  method: get
                  _sid: <sid>
                  path: id:<file-id>
              byPath:
                value:
                  api: SYNO.SynologyDrive.Files
                  version: "11"
                  method: get
                  _sid: <sid>
                  path: /team-folders/<share>/folder/file.txt
      responses:
        "200":
          description: File metadata
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/FileInfoResponse"
                  - $ref: "#/components/schemas/ErrorResponse"

  /webapi/entry.cgi#files-list:
    post:
      tags: [Files]
      summary: List files in a folder
      description: |
        Documentation-only pseudo-endpoint for:

        - `api=SYNO.SynologyDrive.Files`
        - `version=11`
        - `method=list`

        Working transport is query-string RPC with JSON-encoded parameter values.

        Array/object fields such as `filter` and `extra` may need to be JSON-stringified
        depending on the client implementation. Array fields on this WebStation surface
        should not be sent as repeated keys.
      operationId: driveFilesList
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/FilesListForm"
            examples:
              basic:
                value:
                  api: SYNO.SynologyDrive.Files
                  version: "11"
                  method: list
                  _sid: <sid>
                  path: id:<folder-id>
                  sort_by: name
                  sort_direction: asc
                  offset: "0"
                  limit: "100"
      responses:
        "200":
          description: Folder listing
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/FileListResponse"
                  - $ref: "#/components/schemas/ErrorResponse"

  /webapi/entry.cgi#files-search:
    post:
      tags: [Files]
      summary: Search files
      description: |
        Documentation-only pseudo-endpoint for:

        - `api=SYNO.SynologyDrive.Files`
        - `version=11`
        - `method=search`

        Method availability was live-verified on WebStation.
      operationId: driveFilesSearch
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/FilesGenericRpcForm"
            examples:
              generic:
                value:
                  api: SYNO.SynologyDrive.Files
                  version: "11"
                  method: search
                  _sid: <sid>
      responses:
        "200":
          description: Search response
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - $ref: "#/components/schemas/ErrorResponse"

  /webapi/entry.cgi#files-create:
    post:
      tags: [Files]
      summary: Create a folder or a small file
      description: |
        Documentation-only pseudo-endpoint for:

        - `api=SYNO.SynologyDrive.Files`
        - `version=11`
        - `method=create`

        Working transport is query-string RPC with JSON-encoded parameter values.
      operationId: driveFilesCreate
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/FilesCreateForm"
            examples:
              folder:
                value:
                  api: SYNO.SynologyDrive.Files
                  version: "11"
                  method: create
                  _sid: <sid>
                  type: folder
                  path: id:<parent-id>/new-folder
                  conflict_action: stop
              smallFile:
                value:
                  api: SYNO.SynologyDrive.Files
                  version: "11"
                  method: create
                  _sid: <sid>
                  type: file
                  path: id:<parent-id>/hello.txt
                  file_content: SGVsbG8=
      responses:
        "200":
          description: Created file metadata
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/FileInfoResponse"
                  - $ref: "#/components/schemas/ErrorResponse"

  /webapi/entry.cgi#files-update:
    post:
      tags: [Files]
      summary: Rename or update file metadata
      description: |
        Documentation-only pseudo-endpoint for:

        - `api=SYNO.SynologyDrive.Files`
        - `version=11`
        - `method=update`

        Working transport is query-string RPC with JSON-encoded parameter values.
      operationId: driveFilesUpdate
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/FilesUpdateForm"
            examples:
              rename:
                value:
                  api: SYNO.SynologyDrive.Files
                  version: "11"
                  method: update
                  _sid: <sid>
                  path: id:<file-id>
                  name: renamed.txt
      responses:
        "200":
          description: Updated file metadata
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/FileInfoResponse"
                  - $ref: "#/components/schemas/ErrorResponse"

  /webapi/entry.cgi#files-move:
    post:
      tags: [Files]
      summary: Move files or folders
      description: |
        Documentation-only pseudo-endpoint for:

        - `api=SYNO.SynologyDrive.Files`
        - `version=11`
        - `method=move`

        Working transport is query-string RPC with JSON-encoded parameter values.

        Important WebStation rule:
        - `files` must be one JSON-stringified array field such as `["id:<file-id>"]`

        The immediate response only queues an async task. Use `SYNO.SynologyDrive.Tasks.get`
        to determine final success or conflict.
      operationId: driveFilesMove
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/FilesMoveForm"
            examples:
              stopOnConflict:
                value:
                  api: SYNO.SynologyDrive.Files
                  version: "11"
                  method: move
                  _sid: <sid>
                  to_parent_folder: id:<folder-id>
                  conflict_action: stop
                  files: "[\"id:<file-id>\"]"
      responses:
        "200":
          description: Async move request accepted
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AsyncTaskQueuedResponse"
                  - $ref: "#/components/schemas/ErrorResponse"
              examples:
                queued:
                  value:
                    success: true
                    data:
                      async_task_id: task-<n>

  /webapi/entry.cgi#files-delete:
    post:
      tags: [Files]
      summary: Delete files or folders
      description: |
        Documentation-only pseudo-endpoint for:

        - `api=SYNO.SynologyDrive.Files`
        - `version=11`
        - `method=delete`

        Working transport is query-string RPC with JSON-encoded parameter values.

        Important WebStation rule:
        - `files` must be one JSON-stringified array field such as `["id:<file-id>"]`
      operationId: driveFilesDelete
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/FilesDeleteForm"
            examples:
              recycle:
                value:
                  api: SYNO.SynologyDrive.Files
                  version: "11"
                  method: delete
                  _sid: <sid>
                  permanent: "false"
                  files: "[\"id:<file-id>\"]"
      responses:
        "200":
          description: Delete request result
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - $ref: "#/components/schemas/ErrorResponse"

  /webapi/entry.cgi#files-download:
    post:
      tags: [Files]
      summary: Download files
      description: |
        Documentation-only pseudo-endpoint for:

        - `api=SYNO.SynologyDrive.Files`
        - `version=11`
        - `method=download`

        Working transport is query-string RPC with JSON-encoded parameter values.

        Important WebStation rule:
        - `files` must be one JSON-stringified array field such as `["id:<file-id>"]`
      operationId: driveFilesDownload
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/FilesDownloadForm"
            examples:
              single:
                value:
                  api: SYNO.SynologyDrive.Files
                  version: "11"
                  method: download
                  _sid: <sid>
                  files: "[\"id:<file-id>\"]"
                  force_download: "true"
      responses:
        "200":
          description: Download validation response or binary file stream
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - $ref: "#/components/schemas/ErrorResponse"
            application/octet-stream:
              schema:
                type: string
                format: binary
            application/zip:
              schema:
                type: string
                format: binary

  /webapi/entry.cgi:
    post:
      tags: [Files]
      summary: Upload a file
      description: |
        Live-verified multipart transport for:

        - `api=SYNO.SynologyDrive.Files`
        - `version=11`
        - `method=upload`

        Working pattern:
        - `POST /webapi/entry.cgi?api=SYNO.SynologyDrive.Files&version=11&method=upload&_sid=<sid>`
        - `Content-Type: multipart/form-data`

        Observed working `path` form:
        - `id:<parent-id>/<basename>`
      operationId: driveFilesUpload
      parameters:
        - name: api
          in: query
          required: true
          schema:
            type: string
            const: SYNO.SynologyDrive.Files
        - name: version
          in: query
          required: true
          schema:
            type: integer
            const: 11
        - name: method
          in: query
          required: true
          schema:
            type: string
            const: upload
        - name: _sid
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/FilesUploadMultipart"
            examples:
              basic:
                value:
                  path: id:<parent-id>/report.pdf
                  type: file
                  conflict_action: stop
      responses:
        "200":
          description: Uploaded file metadata
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/FileInfoResponse"
                  - $ref: "#/components/schemas/ErrorResponse"

  /webapi/entry.cgi#tasks-list:
    get:
      tags: [Tasks]
      summary: List Synology Drive tasks
      description: |
        Documentation-only pseudo-endpoint for:

        - `api=SYNO.SynologyDrive.Tasks`
        - `version=1`
        - `method=list`
      operationId: driveTasksList
      parameters:
        - name: api
          in: query
          required: true
          schema:
            type: string
            const: SYNO.SynologyDrive.Tasks
        - name: version
          in: query
          required: true
          schema:
            type: integer
            const: 1
        - name: method
          in: query
          required: true
          schema:
            type: string
            const: list
        - name: _sid
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Task listing
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/DriveTaskListResponse"
                  - $ref: "#/components/schemas/ErrorResponse"

  /webapi/entry.cgi#tasks-get:
    get:
      tags: [Tasks]
      summary: Get one Synology Drive task
      description: |
        Documentation-only pseudo-endpoint for:

        - `api=SYNO.SynologyDrive.Tasks`
        - `version=1`
        - `method=get`
      operationId: driveTasksGet
      parameters:
        - name: api
          in: query
          required: true
          schema:
            type: string
            const: SYNO.SynologyDrive.Tasks
        - name: version
          in: query
          required: true
          schema:
            type: integer
            const: 1
        - name: method
          in: query
          required: true
          schema:
            type: string
            const: get
        - name: task_id
          in: query
          required: true
          schema:
            type: string
        - name: _sid
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Task detail
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/DriveTaskGetResponse"
                  - $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidTask:
                  value:
                    success: false
                    error:
                      code: 401
                      errors:
                        message: invalid task id
                conflict:
                  value:
                    success: true
                    data:
                      task_id: task-<n>
                      status: finished
                      progress: 100
                      result:
                        action: move
                        errors:
                          - code: 1022
                            message: file operation is stopped
                            context:
                              file_type: file
                              name: sample.txt
                              path: /folder/sample.txt
                        processed_size: 0
                        total_size: 123

  /webapi/entry.cgi#webhooks-create:
    post:
      tags: [Webhooks]
      summary: Create a webhook
      description: |
        Documentation-only pseudo-endpoint for:

        - `api=SYNO.SynologyDrive.Webhooks`
        - `version=2`
        - `method=create`

        Live WebStation transport uses query-string RPC with JSON-encoded parameter values.
      operationId: driveWebhooksCreate
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/WebhooksCreateForm"
            examples:
              urlWebhook:
                value:
                  api: SYNO.SynologyDrive.Webhooks
                  version: "2"
                  method: create
                  _sid: <sid>
                  type: url
                  app_id: <app-id>
                  url: https://example.invalid/webhook
      responses:
        "200":
          description: Created webhook
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/WebhookInfoResponse"
                  - $ref: "#/components/schemas/ErrorResponse"

  /webapi/entry.cgi#webhooks-get:
