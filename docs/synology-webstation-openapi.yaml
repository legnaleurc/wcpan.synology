      tags: [Labels]
      summary: List personal or shared labels
      description: |
        Documentation-only pseudo-endpoint for:

        - `api=SYNO.SynologyDrive.Labels`
        - observed methods: `list`, `create`, `update`, `delete`, `set`

        Observed request hints:
        - optional `type:"shared_label"` is used for shared-label listing

        Observed response hints:
        - root collection often appears as `items`
        - item fields commonly include `label_id`, `name`, `color`, `position`
        - shared-label items additionally expose `permission`, `display`, and `apply_permission`
      operationId: driveLabelsList
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/ObservedRpcForm"
      responses:
