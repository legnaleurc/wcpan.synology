[project]
name = "wcpan-synology"
version = "0.1.0"
description = "Async client for the Synology Drive WebStation API"
authors = [
    { name = "Wei-Cheng Pan", email = "legnaleurc@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "aiohttp>=3.13.0,<4.0.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.scripts]
"wcpan-synology" = "wcpan.synology.cli:main"

[dependency-groups]
dev = [
    "coverage>=7.6.0,<8.0.0",
    "pyright>=1.1,<2.0",
    "ruff>=0.15.0,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wcpan"]
